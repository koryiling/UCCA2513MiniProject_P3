<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.explainer">Admission Requirement Explainer | UTAR Admission Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admission">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="crumb"><a href="index.html" data-i18n="nav.home">Home</a> › <a href="admission.html#tools" data-i18n="nav.admission">Admission</a> › <span data-i18n="mod.explainer.title">Admission Requirement Explainer</span></p>
        <h1 data-i18n="mod.explainer.title">Admission Requirement Explainer</h1>
        <p data-i18n="tools.explainer.sub">Choose a programme to see its minimum entry requirements in simple points.</p>
      </div>
    </section>

    <section class="container section tool-layout tool-single" id="tool">
      <div>
        <div class="tool-form">
          <label class="field"><span data-i18n="tools.programme">Programme</span>
            <select id="programme"><option value="" data-i18n="tools.loading">Loading…</option></select>
          </label>
        </div>
        <p class="source" id="coverage"></p>
      </div>
      <div id="result" aria-live="polite"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-tools.js"></script>
  <script src="js/script.js"></script>
  <script src="js/admission-tools.js"></script>
  <script>initExplainer();</script>
</body>
</html>
