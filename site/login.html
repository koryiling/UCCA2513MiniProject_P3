<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | UTAR Admission Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <aside class="auth-side">
      <a href="index.html"><img src="images/logo.jpg" alt="UTAR logo" class="auth-logo"></a>
      <h2>UTAR Admission Assistant</h2>
      <p>Log in to access the Application section: your document checklist, application journey tracker and deadline reminders.</p>
    </aside>

    <section class="auth-main">
      <a href="index.html" class="back-link">← Back to Home</a>
      <img src="images/logo.jpg" alt="UTAR logo" class="auth-logo-mobile">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to continue to the Application section</p>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
        <small class="error" data-for="email"></small>

        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="password">Show</button>
        </div>
        <small class="error" data-for="password"></small>

        <div class="auth-row">
          <label class="check"><input type="checkbox" name="remember"> Remember me</label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-dark btn-block">Login</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      <p class="auth-guest"><a href="index.html">Continue as guest</a></p>
    </section>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
