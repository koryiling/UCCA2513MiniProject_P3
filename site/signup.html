<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.signup">Sign Up | UTAR Admission Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <aside class="auth-side">
      <a href="index.html"><img src="images/logo.jpg" alt="UTAR logo" class="auth-logo"></a>
      <h2 data-i18n="auth.side.title">UTAR Admission Assistant</h2>
      <p data-i18n="auth.signup.side">Create a free account to save your progress as you prepare your UTAR application.</p>
      <ul class="auth-perks">
        <li data-i18n="auth.perk1">Personalized document checklist</li>
        <li data-i18n="auth.perk2">Application journey tracker</li>
        <li data-i18n="auth.perk3">Deadline reminders</li>
      </ul>
    </aside>

    <section class="auth-main">
      <div class="auth-top">
        <a href="index.html" class="back-link" data-i18n="auth.back">← Back to Home</a>
        <div class="auth-lang"></div>
      </div>
      <img src="images/logo.jpg" alt="UTAR logo" class="auth-logo-mobile">
      <h1 data-i18n="auth.signup.h">Create an account</h1>
      <p class="auth-sub" data-i18n="auth.signup.sub">Sign up in a few seconds</p>

      <form id="signupForm" novalidate>
        <label for="name" data-i18n="auth.name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" data-i18n-placeholder="auth.ph.name" autocomplete="name">
        <small class="error" data-for="name"></small>

        <label for="email" data-i18n="auth.email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
        <small class="error" data-for="email"></small>

        <label for="password" data-i18n="auth.password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" placeholder="At least 8 characters" data-i18n-placeholder="auth.ph.newPassword" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="password" data-i18n="auth.show">Show</button>
        </div>
        <small class="error" data-for="password"></small>

        <label for="confirm" data-i18n="auth.confirm">Confirm password</label>
        <div class="pw-wrap">
          <input id="confirm" name="confirm" type="password" placeholder="Re-enter your password" data-i18n-placeholder="auth.ph.confirm" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirm" data-i18n="auth.show">Show</button>
        </div>
        <small class="error" data-for="confirm"></small>

        <label class="check"><input type="checkbox" id="agree" name="agree"> <span data-i18n="auth.agree">I understand this system provides guidance only and is not an official UTAR application.</span></label>
        <small class="error" data-for="agree"></small>

        <button type="submit" class="btn btn-dark btn-block" data-i18n="auth.signup.btn">Sign Up</button>
      </form>

      <p class="auth-switch"><span data-i18n="auth.haveAccount">Already have an account?</span> <a href="login.html" data-i18n="auth.loginLink">Log in</a></p>
    </section>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
